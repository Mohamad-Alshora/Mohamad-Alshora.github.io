<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 525" role="img" aria-labelledby="title description">
  <title id="title">IoT Gateway Telemetrie-Monitoring</title>
  <desc id="description">Industrielles Dashboard mit Sensorstatus, Telemetrie-Kennzahlen, Temperaturverlauf und QA-Prüfprotokoll.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c2e"/>
      <stop offset="1" stop-color="#17283d"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #9fb0c5; }
      .white { fill: #f3f7fc; }
      .small { font-size: 12px; }
      .label { font-size: 13px; font-weight: 600; }
      .value { font-size: 26px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="525" fill="url(#background)"/>
  <rect x="22" y="20" width="1156" height="485" rx="13" fill="#f6f8fb"/>
  <rect x="22" y="20" width="1156" height="60" rx="13" fill="#fff"/>
  <path d="M22 67h1156" stroke="#e2e8f0"/>
  <rect x="43" y="37" width="27" height="27" rx="7" fill="#2563eb"/>
  <path d="M50 51h13M56.5 44.5v13" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="81" y="49" fill="#172033" font-size="15" font-weight="700">Gateway Monitor</text>
  <text x="81" y="65" fill="#718096" font-size="10">PRODUCTION / TELEMETRY OVERVIEW</text>
  <circle cx="1030" cy="50" r="4" fill="#20a88a"/>
  <text x="1042" y="54" fill="#334155" font-size="11" font-weight="600">Gateway online</text>

  <text x="45" y="110" fill="#172033" font-size="16" font-weight="700">IoT Sensor Fleet</text>
  <text x="45" y="129" fill="#64748b" font-size="11">Standort Werk 02 / Linie A</text>

  <g>
    <rect x="44" y="145" width="265" height="87" rx="9" fill="#fff" stroke="#e2e8f0"/>
    <text x="61" y="169" class="muted small">Aktive Sensoren</text>
    <text x="61" y="207" fill="#172033" class="value">24</text>
    <text x="102" y="205" fill="#167344" font-size="11" font-weight="600">● 23 stabil</text>
    <text x="281" y="205" text-anchor="end" fill="#64748b" font-size="10">/ 24</text>

    <rect x="322" y="145" width="265" height="87" rx="9" fill="#fff" stroke="#e2e8f0"/>
    <text x="339" y="169" class="muted small">Temperatur · Sensor 01</text>
    <text x="339" y="207" fill="#172033" class="value">22.4<tspan font-size="15"> °C</tspan></text>
    <text x="565" y="205" text-anchor="end" fill="#167344" font-size="10">NORMAL</text>

    <rect x="600" y="145" width="265" height="87" rx="9" fill="#fff" stroke="#e2e8f0"/>
    <text x="617" y="169" class="muted small">Nachrichten / 24 h</text>
    <text x="617" y="207" fill="#172033" class="value">18,420</text>
    <text x="843" y="205" text-anchor="end" fill="#64748b" font-size="10">JSON / REST</text>

    <rect x="878" y="145" width="278" height="87" rx="9" fill="#fff" stroke="#e2e8f0"/>
    <text x="895" y="169" class="muted small">QA-Validierung</text>
    <text x="895" y="207" fill="#172033" class="value">99.8<tspan font-size="15">%</tspan></text>
    <text x="1134" y="205" text-anchor="end" fill="#167344" font-size="10">PASS RATE</text>
  </g>

  <rect x="44" y="247" width="700" height="230" rx="9" fill="#fff" stroke="#e2e8f0"/>
  <text x="62" y="273" fill="#172033" class="label">Temperaturverlauf</text>
  <text x="62" y="291" fill="#64748b" class="small">Sensor 01 · letzte 60 Minuten</text>
  <rect x="624" y="260" width="100" height="24" rx="12" fill="#eff6ff"/>
  <circle cx="638" cy="272" r="3" fill="#2563eb"/>
  <text x="647" y="276" fill="#334155" font-size="10">Live-Daten</text>
  <g stroke="#e9eef5" stroke-width="1">
    <path d="M88 323h624M88 359h624M88 395h624M88 431h624"/>
  </g>
  <g fill="#7b8798" font-size="9" text-anchor="end">
    <text x="78" y="326">40°</text><text x="78" y="362">30°</text><text x="78" y="398">20°</text><text x="78" y="434">10°</text>
  </g>
  <path d="M94 389L145 383L196 394L247 374L298 380L349 355L400 365L451 347L502 358L553 338L604 349L655 332L708 341V449H94Z" fill="url(#chart)"/>
  <path d="M94 389L145 383L196 394L247 374L298 380L349 355L400 365L451 347L502 358L553 338L604 349L655 332L708 341" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M94 359h614" stroke="#d39a34" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="702" y="353" text-anchor="end" fill="#996a12" font-size="9">QA threshold 30 °C</text>
  <g fill="#7b8798" font-size="9">
    <text x="94" y="462">12:00</text><text x="244" y="462">12:15</text><text x="394" y="462">12:30</text><text x="544" y="462">12:45</text><text x="708" y="462" text-anchor="end">13:00</text>
  </g>

  <rect x="758" y="247" width="398" height="230" rx="9" fill="#fff" stroke="#e2e8f0"/>
  <text x="778" y="273" fill="#172033" class="label">QA-Prüfprotokoll</text>
  <text x="778" y="291" fill="#64748b" class="small">Letzte eingehende Telemetrie-Requests</text>
  <rect x="778" y="307" width="358" height="43" rx="6" fill="#f7fafc"/>
  <circle cx="795" cy="328" r="5" fill="#20a88a"/>
  <text x="809" y="325" fill="#334155" font-size="11" font-weight="600">13:47:22 · sensor-01</text>
  <text x="809" y="340" fill="#64748b" font-size="10">HTTP 200 · Temperatur im Betriebsbereich</text>
  <rect x="778" y="358" width="358" height="43" rx="6" fill="#fffbeb"/>
  <circle cx="795" cy="379" r="5" fill="#d39a34"/>
  <text x="809" y="376" fill="#334155" font-size="11" font-weight="600">13:46:08 · sensor-08</text>
  <text x="809" y="391" fill="#996a12" font-size="10">WARN · Schwellenwert prüfen</text>
  <rect x="778" y="409" width="358" height="43" rx="6" fill="#fff1f2"/>
  <circle cx="795" cy="430" r="5" fill="#d86770"/>
  <text x="809" y="427" fill="#334155" font-size="11" font-weight="600">13:42:51 · sensor-14</text>
  <text x="809" y="442" fill="#ad4450" font-size="10">HTTP 422 · Payload ungültig</text>
</svg>
